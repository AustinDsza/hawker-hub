name: hawker_hub
description: A mobile app for connecting hawkers with customers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.5
  google_maps_flutter: ^2.5.0
  flutter_map: ^4.0.0
  latlong2: ^0.8.2
  geolocator: ^10.1.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  lottie: ^2.7.0
  flutter_local_notifications: ^14.1.5
  flutter_secure_storage: ^8.0.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  uuid: ^3.0.7
  permission_handler: ^10.4.5
  supabase_flutter: ^1.10.25
  http: ^0.13.6
  location: ^8.0.0
  fl_chart: ^0.65.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/mapbox/
    - sample_inventory.json 